    <!-- [AI:Claude] 2026-08-10 — Polyfill URL.parse() pour Safari.
         pdf.js (via react-pdf) appelle URL.parse(), une methode statique
         recente du standard URL, absente des versions de Safari encore
         largement utilisees. Signale par une utilisatrice : "Une erreur
         s'est produite" a l'ouverture ou l'enregistrement d'un patron PDF,
         TypeError "URL.parse is not a function".
         Correctif cible plutot que remplacer toute la classe URL : on
         n'ajoute que la methode manquante, sans toucher au reste du
         comportement natif. Place ici, avant le bundle, pour s'appliquer
         quel que soit le morceau charge (le compteur de projet, ou l'import
         de patron, sont tous deux dans des morceaux differencies). -->
    <script>
      if (typeof URL.parse !== 'function') {
        URL.parse = function (url, base) {
          try { return new URL(url, base); } catch { return null; }
        };
      }
    </script>

    <script>

      // Force mise a jour SW — a n'incrementer QUE pour un vrai bug de cache
      // generalise, pas a chaque deploiement.
      // [AI:Claude] 2026-08-20 — Revise apres coup. La note d'origine disait
      // "incrementer a chaque deploiement majeur" (2026-08-17), suite a l'oubli
      // qui avait empeche le correctif URL.parse() du 10 aout d'atteindre les
      // visiteuses deja passees sur le site. Mais l'incrementer a chaque fois a
      // son propre cout : ce bloc desinscrit le service worker et vide TOUS les
      // caches de TOUT LE MONDE a la prochaine visite, qui doit alors tout
      // retelecharger avant de pouvoir fonctionner hors ligne ou en reseau
      // faible. Une utilisatrice a perdu l'usage de l'app Android pile a ce
      // moment, en mauvais reseau — resolu par un simple rechargement en bon
      // reseau, mais evitable : le renouvellement des noms de fichiers avec
      // empreinte (deja en place, cleanupOutdatedCaches: true dans
      // vite.config.js) suffit pour un deploiement normal. Ce interrupteur
      // reste reserve aux cas ou un cache perime doit etre purge de force chez
      // tout le monde, pas a une habitude systematique.
      var SW_VERSION = '2026081701';
      var STORED_VERSION = localStorage.getItem('sw_version');
      if (STORED_VERSION !== SW_VERSION) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(r) { r.unregister(); });
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
        }
        localStorage.setItem('sw_version', SW_VERSION);
        if (STORED_VERSION) {
          window.location.reload(true);
        }
      }
    </script>
